name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  self-test:
    name: self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./
        with:
          project: testdata/local-marker
          command: check
      - name: Require SARIF file
        run: |
          set -euo pipefail
          test -f mint.sarif
          python3 -c 'import json; body=json.load(open("mint.sarif")); assert body["version"]=="2.1.0"'
